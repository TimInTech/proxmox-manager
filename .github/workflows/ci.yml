name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(find . -maxdepth 4 -type f -name '*.sh' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck -x "${files[@]}"

      - name: Download, verify, and run shfmt
        env:
          SHFMT_VERSION: 3.13.1
          SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
        run: |
          set -euo pipefail
          shfmt_path="${RUNNER_TEMP}/shfmt"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --retry 3 \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            --output "${shfmt_path}"
          printf '%s  %s\n' "${SHFMT_SHA256}" "${shfmt_path}" | sha256sum --check --strict
          chmod 0755 "${shfmt_path}"
          "${shfmt_path}" -d proxmox-manager.sh

      - name: Run tests
        run: bash tests/run.sh
